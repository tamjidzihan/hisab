services:
  # ─────────────────────────────────────────────────────────────
  #  Hisab Backend API (The Draftsman's Ledger)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hisab-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5173}
      # Database Connection
      - DB_DIALECT=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-hisab_finance_tracker}
      - DB_USER=${DB_USER:-hisab_user}
      - DB_PASSWORD=${DB_PASSWORD:-hisab_secure_password_2026}
      # Auth & Security
      - JWT_SECRET=${JWT_SECRET:-hisab_master_draftsman_jwt_secret_key_2026_ledger}
      - SESSION_COOKIE_NAME=hisab_session
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      # Uploads
      - MAX_RECEIPT_SIZE_MB=5
      - UPLOAD_DIR=/app/uploads
    volumes:
      - hisab_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hisab-network

  # ─────────────────────────────────────────────────────────────
  #  MySQL 8 Database Service
  # ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: hisab-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=${DB_NAME:-hisab_finance_tracker}
      - MYSQL_USER=${DB_USER:-hisab_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-hisab_secure_password_2026}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_super_secret_2026}
    ports:
      - "3306:3306"
    volumes:
      - hisab_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hisab-network

volumes:
  hisab_uploads:
    name: hisab_uploads
  hisab_mysql_data:
    name: hisab_mysql_data

networks:
  hisab-network:
    name: hisab-network
    driver: bridge
