# ─────────────────────────────────────────────────────────────
#  Hisab Backend — Lightweight Standalone (SQLite) Docker Compose
#  Usage: docker compose -f docker-compose.sqlite.yml up -d
# ─────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hisab-backend-sqlite
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5173}
      # Database: SQLite stored in persistent volume
      - DB_DIALECT=sqlite
      - DB_STORAGE=/app/data/database.sqlite
      # Auth & Security
      - JWT_SECRET=${JWT_SECRET:-hisab_master_draftsman_jwt_secret_key_2026_ledger}
      - SESSION_COOKIE_NAME=hisab_session
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      # Uploads
      - MAX_RECEIPT_SIZE_MB=5
      - UPLOAD_DIR=/app/uploads
    volumes:
      - hisab_sqlite_data:/app/data
      - hisab_uploads:/app/uploads

volumes:
  hisab_sqlite_data:
    name: hisab_sqlite_data
  hisab_uploads:
    name: hisab_uploads
